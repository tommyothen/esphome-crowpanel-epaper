# Live mode on the 5.79", no network: a clock counting the seconds since boot, a ball bouncing,
# a ticker along the bottom that slides each item in and then holds it, and how many ticks a
# second the panel is managing. In live mode the driver draws the next frame while the panel shows
# the last, and goes on by itself while the picture changes, so nothing here asks for updates
# after the first.
esphome:
  name: crowpanel-live-579
  on_boot:
    - priority: -100
      then:
        - lambda: id(epd).request_full_update();
        - component.update: epd
        - wait_until:
            condition:
              not:
                epaper_spi.is_updating: epd
        - component.update: epd

esp32:
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO
  hardware_uart: UART0

external_components:
  - source:
      type: local
      path: ../components
    components: [crowpanel_579, crowpanel_epaper]

spi:
  clk_pin: GPIO12
  mosi_pin: GPIO11

font:
  - { file: "gfonts://Inter@700", id: f_clock, size: 96, bpp: 2, glyphs: ["0123456789:"] }
  - { file: "gfonts://Inter@700", id: f_text, size: 30, bpp: 2, glyphsets: [GF_Latin_Core] }
  - { file: "gfonts://Inter@500", id: f_small, size: 14, bpp: 2, glyphsets: [GF_Latin_Core] }

display:
  - platform: crowpanel_579
    id: epd
    grey: true
    grey_partials: live
    full_update_every: 255
    lambda: |-
      const uint32_t now = millis();
      // Ticks a second, shown once a second so the number itself does not churn.
      static uint32_t shown_at = 0, ticks = 0;
      static float rate = 0;
      ticks++;
      if (now - shown_at >= 1000) {
        rate = ticks * 1000.0f / (now - shown_at);
        ticks = 0;
        shown_at = now;
      }
      const int w = it.get_width(), h = it.get_height();
      it.fill(Color::WHITE);
      const uint32_t s = now / 1000;
      it.printf(150, 96, id(f_clock), Color::BLACK, TextAlign::CENTER, "%02u:%02u", (unsigned) (s / 60 % 60),
                (unsigned) (s % 60));
      it.printf(150, 176, id(f_small), Color::BLACK, TextAlign::CENTER, "Live: %.0f ticks a second", rate);
      // A ball bouncing in the right of the panel.
      auto bounce = [](float p, float span) {
        const float m = fmodf(p, 2 * span);
        return m < span ? m : 2 * span - m;
      };
      const float t = now / 1000.0f;
      const int r = 24, left = 330, right = w - 12, top = 10, bottom = h - 66;
      it.rectangle(left - r - 4, top, right - left + 2 * r + 8, bottom - top, Color::BLACK);
      it.filled_circle(left + bounce(t * 90, right - left - 2 * r), top + r + 4 + bounce(t * 60, bottom - top - 2 * r - 8),
                       r, Color::BLACK);
      // A ticker along the bottom: one item at a time, sliding in from the right over half a
      // second and then holding still, so the ink settles crisp; the next every four seconds.
      static const char *const ITEMS[] = {"Bins out tonight", "Rain from 15:00", "Dinner at 19:00", "Parcel due by 12:00"};
      const uint32_t item = now / 4000 % 4, into = now % 4000;
      const float slide = into < 500 ? 1 - into / 500.0f : 0;
      it.line(0, h - 52, w, h - 52, Color::BLACK);
      it.print(12 + static_cast<int>(slide * slide * w), h - 26, id(f_text), Color::BLACK, TextAlign::CENTER_LEFT,
               ITEMS[item]);

# Builds the docs site from the README and docs/ on every change, so a broken page fails the check,
# and publishes it to GitHub Pages from main. Pages sites are public, so publishing waits until the
# repository is too.
name: Docs

on:
  push:
    branches: [main]
    paths: [README.md, docs/**, site/**, .github/workflows/docs.yml]
  pull_request:
    paths: [README.md, docs/**, site/**, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: withastro/action@a8b97df764791eb61fbf3338ef713b0e61ae05c5 # v6.1.4
        with:
          path: ./site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !github.event.repository.private
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
